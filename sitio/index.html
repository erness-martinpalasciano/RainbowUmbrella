<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Nombre de la Marca</title>
<meta name="description" content="Catálogo de productos y servicios.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span data-brand-name>Nombre de la Marca</span>
    </a>
    <div class="header-contact">
      <a class="btn-whatsapp" data-whatsapp-link data-whatsapp-msg="Hola! Quería hacer una consulta." href="#">
        <span>Escribir por WhatsApp</span>
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="container hero-inner">
    <span class="hero-eyebrow">Catálogo online</span>
    <h1 data-brand-name>Nombre de la Marca</h1>
    <p data-brand-desc>Descripción corta de la marca (una frase) — reemplazar con la propuesta real de valor del negocio.</p>
  </div>
</section>

<nav class="category-nav">
  <div class="container">
    <div class="category-scroll" id="category-scroll"></div>
  </div>
</nav>

<main class="catalog-section">
  <div class="container" id="catalog-root"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© <span data-year></span> <span data-brand-name>Nombre de la Marca</span></span>
    <a data-whatsapp-link data-whatsapp-msg="Hola! Quería hacer una consulta." href="#">Contactar por WhatsApp</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
